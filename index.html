<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjab Rural School - Web Attendance</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: #f4f7f9; 
            margin: 0;
            padding: 20px;
        }
        h1 { 
            color: #005a9c;
            font-weight: 600;
        }
        #container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: white; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); 
            border: 1px solid #e1e4e8;
        }
        video { 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            width: 100%;
            max-width: 640px; 
            height: auto; 
            background-color: #222;
        }
        #result { 
            margin-top: 1.5rem; 
            font-size: 2.2rem; 
            font-weight: bold; 
            color: #333; 
            min-height: 50px; 
            text-align: center;
        }
        #status { 
            margin-top: 1rem;
            color: #d9534f; 
        }
    </style>
</head>
<body>
    <h1>Punjab Rural School - Web Attendance</h1>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <div id="result">Initializing...</div>
        <p id="status"></p>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const resultDiv = document.getElementById('result');
        const statusDiv = document.getElementById('status');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const SERVER_URL = 'http://1227.0.0.1:5000/recognize';

        // 1. Access Webcam
        async function setupWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                statusDiv.textContent = "Webcam active. Point camera at face.";
                statusDiv.style.color = '#5cb85c';
            } catch (err) {
                console.error("Error accessing webcam: ", err);
                statusDiv.textContent = "Error: Could not access webcam. Please allow camera permissions.";
            }
        }

        // 2. Send frames to server for recognition
        async function recognize() {
            if (video.readyState < 2) {
                // Wait until the video is ready to play.
                return;
            }
            // Set canvas size to match video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            // Draw current video frame to the canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            // Convert canvas image to Base64 data URL
            const imageData = canvas.toDataURL('image/jpeg');

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }

                const data = await response.json();
                
                // 3. Display the result
                if (data.name && data.name !== "Unknown") {
                    resultDiv.textContent = `Welcome, ${data.name}!`;
                    resultDiv.style.color = '#005a9c'; // Blue for success
                } else {
                    resultDiv.textContent = "Scanning...";
                    resultDiv.style.color = '#555';
                }

            } catch (error) {
                console.error('Error recognizing face:', error);
                statusDiv.textContent = "Connection Error: Make sure the Python server (app.py) is running in the command prompt.";
                statusDiv.style.color = '#d9534f';
            }
        }

        setupWebcam();
        // Call recognize function every 2 seconds
        setInterval(recognize, 2000);
    </script>
</body>
</html>
