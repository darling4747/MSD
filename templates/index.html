<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .container {
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .title {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 2rem;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .nav-button {
            display: block;
            background-image: linear-gradient(to right, #6366f1, #8b5cf6);
            color: white;
            padding: 1.25rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .nav-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            background-image: linear-gradient(to right, #4f46e5, #7c3aed);
        }
        .nav-button:active {
            transform: translateY(0);
        }
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            .title {
                font-size: 1.5rem;
            }
            .nav-button {
                font-size: 1rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Attendance System</h1>
        <p class="subtitle">Select an option to get started.</p>
        <div class="nav-links">
            <a href="/register" class="nav-button">Register a Student</a>
            <a href="/attendance" class="nav-button">Mark Attendance</a>
            <a href="/view_attendance" class="nav-button">View Attendance</a>
        </div>
    </div>
</body>
</html>
